<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asystent ARGO</title>
<style>
:root{--red:#ef4444;--dark:#991b1b;--bg:#07111d;--bg2:#0f172a}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 15%,rgba(239,68,68,.12),transparent 26%),linear-gradient(135deg,var(--bg),var(--bg2));color:#edf2f7;font-family:Arial,sans-serif}body{overflow:hidden}.date-time{position:fixed;top:22px;right:24px;z-index:10;color:var(--red);text-align:right}.date{display:block;font-size:17px;text-transform:capitalize}.time{display:block;font-size:29px;font-weight:700}.brand{position:fixed;top:20px;left:24px;z-index:20;opacity:0;transform:translateX(-55px);pointer-events:none}.brand.show{animation:brandIn .9s cubic-bezier(.22,1,.36,1) forwards}.label{display:block;color:#dbe7f4;font-size:10px;letter-spacing:3px}.name{display:block;color:var(--red);font-size:28px;font-weight:800;letter-spacing:3px;text-shadow:0 0 12px rgba(239,68,68,.65)}.top-line{position:fixed;top:110px;left:0;right:0;border-top:1px solid rgba(255,255,255,.35)}.sidebar{position:fixed;top:110px;bottom:0;left:0;width:220px;padding:18px 14px;background:rgba(15,23,42,.45);border-right:1px solid rgba(255,255,255,.35)}.applications-title{margin:0 0 12px 4px;color:#dfe9f7;font-size:11px;letter-spacing:2px;text-transform:uppercase}.app-item,.distribution-button{width:100%;padding:13px 12px;margin-bottom:10px;border:1px solid rgba(239,68,68,.6);border-radius:10px;background:rgba(239,68,68,.16);color:#fff;cursor:pointer}.app-item{display:flex;align-items:center;gap:12px;text-align:left}.app-item:hover{transform:translateX(5px);background:rgba(239,68,68,.26)}.app-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,var(--red),var(--dark));font-weight:700}.distribution-wrap{position:absolute;left:14px;right:14px;bottom:18px}.distribution-button{background:#b91c1c}.beta-version{margin-top:6px;color:#fca5a5;font-size:10px;letter-spacing:1px;text-align:center}.main-content{min-height:100vh;padding:160px 20px 20px 240px;display:flex;align-items:center;justify-content:center}.welcome-box{width:min(440px,80vw);min-height:220px;padding:32px;display:grid;place-items:center;text-align:center;border:1px solid rgba(255,255,255,.25);border-radius:18px;background:rgba(255,255,255,.08);box-shadow:0 20px 45px rgba(0,0,0,.3);opacity:0;transform:translateY(25px) scale(.9);filter:blur(7px)}.welcome-box.show{animation:welcomeIn 1.1s cubic-bezier(.22,1,.36,1) forwards}.welcome-box.hide{animation:welcomeOut .8s ease forwards}.welcome-box h1{margin:0;font-size:clamp(28px,5vw,50px);font-weight:400}.argo{display:block;margin-top:8px;color:var(--red);letter-spacing:3px;font-weight:800}.welcome-box p{margin:16px 0 0;color:#94a3b8;line-height:1.6}.window{position:fixed;z-index:30;top:126px;left:250px;width:min(660px,calc(100vw - 280px));max-height:calc(100vh - 150px);display:none;flex-direction:column;border-radius:18px;background:rgba(15,23,42,.96);border:1px solid rgba(239,68,68,.35);box-shadow:0 25px 70px rgba(0,0,0,.7)}.window.active{display:flex}.window.small{width:min(468px,calc(100vw - 280px))}.panel-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.panel-header h2{margin:0;font-size:17px}.close-button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.14);color:#fff;background:rgba(255,255,255,.06);cursor:pointer}.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:18px}.message{max-width:78%;padding:12px 14px;border-radius:14px;line-height:1.5;font-size:14px}.message.assistant{align-self:flex-start;background:rgba(239,68,68,.12);border-top-left-radius:5px}.message.user{align-self:flex-end;background:linear-gradient(135deg,#b91c1c,#7f1d1d)}.message strong{display:block;margin-bottom:4px;color:#fca5a5;font-size:10px;letter-spacing:1px}.assistant-selector{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px}.assistant-selector select{padding:6px 8px;background:#1e293b;color:#fff;border:1px solid rgba(239,68,68,.5);border-radius:7px}.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.08)}.chat-form input{flex:1;padding:11px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff}.chat-form button{padding:0 16px;border:0;border-radius:9px;background:var(--dark);color:#fff;cursor:pointer}.card{padding:18px}.calc-display{width:100%;margin-bottom:12px;padding:12px;background:#020617;color:#fca5a5;border:1px solid rgba(239,68,68,.5);border-radius:9px;text-align:right;font-size:24px}.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.calc-grid button{min-height:38px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:rgba(255,255,255,.07);color:#fff;cursor:pointer}.notes-area{width:100%;min-height:260px;resize:vertical;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff}.files-box{display:flex;flex-direction:column;gap:12px;padding:16px}.drop-zone{display:flex;align-items:center;justify-content:center;min-height:115px;border:1px dashed rgba(239,68,68,.6);border-radius:12px;background:rgba(239,68,68,.08);color:#fca5a5;text-align:center;cursor:pointer}.drop-zone input{display:none}.file-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}.file-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}.file-actions{display:flex;gap:6px}.file-actions button{border:0;border-radius:6px;padding:6px 8px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}@keyframes welcomeIn{to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes welcomeOut{to{opacity:0;transform:translateY(-20px) scale(1.04);filter:blur(7px)}}@keyframes brandIn{0%{opacity:0;transform:translateX(-55px)}70%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:translateX(0)}}@media(max-width:720px){body{overflow:auto}.sidebar{width:150px}.main-content{padding-left:160px}.window{left:155px;right:8px;width:calc(100vw - 170px)}.window.small{width:calc(100vw - 170px)}}
</style>
</head>
<body>
<div class="date-time"><span class="date" id="date"></span><span class="time" id="time"></span></div>
<div class="brand" id="brand"><span class="label">ASYSTENT</span><span class="name">ARGO</span></div><div class="top-line"></div>
<aside class="sidebar"><div class="applications-title">Aplikacje</div><button class="app-item" data-window="chat"><span class="app-icon">C</span><span>Czat</span></button><button class="app-item" data-window="calc"><span class="app-icon">∑</span><span>Kalkulator</span></button><button class="app-item" data-window="files"><span class="app-icon">F</span><span>Magazyn</span></button><button class="app-item" data-window="calendar"><span class="app-icon">K</span><span>Kalendarz</span></button><div class="distribution-wrap"><button class="distribution-button" id="distribution">Dystrybucja</button><div class="beta-version">V 2.5 BETA</div></div></aside>
<main class="main-content"><section class="welcome-box" id="welcome"><div><h1>Witaj w asystencie<span class="argo">ARGO</span></h1><p>Twoje centrum pracy, planowania, notatek i danych.</p></div></section></main>
<section class="window" id="chat"><div class="panel-header"><h2>Asystent ARGO</h2><button class="close-button" data-close="chat">×</button></div><div class="assistant-selector">Rodzaj asystenta: <select><option>ARGO DOCTUS</option></select></div><div class="chat-messages" id="messages"><div class="message assistant"><strong>ARGO DOCTUS</strong>Witaj. Jestem gotowy do pomocy.</div></div><form class="chat-form" id="form"><input id="input" placeholder="Napisz wiadomość..." autocomplete="off"><button>Wyślij</button></form></section>
<section class="window small" id="calc"><div class="panel-header"><h2>Kalkulator ARGO</h2><button class="close-button" data-close="calc">×</button></div><div class="card"><input class="calc-display" id="display" readonly><div class="calc-grid" id="grid"></div></div></section>
<section class="window small" id="files"><div class="panel-header"><h2>Magazyn plików</h2><button class="close-button" data-close="files">×</button></div><div class="files-box"><label class="drop-zone">Kliknij, aby dodać pliki<input id="fileInput" type="file" multiple></label><div class="file-list" id="fileList"></div></div></section>
<section class="window small" id="calendar"><div class="panel-header"><h2>Kalendarz i plan dnia</h2><button class="close-button" data-close="calendar">×</button></div><div class="card"><textarea class="notes-area" id="notes" placeholder="Wpisz plan dnia..."></textarea></div></section>
<div class="modal" id="modal"><div class="modal-card"><button class="close-button" id="modalClose">×</button><h3>Dystrybucja ARGO</h3><p>Model: ARGO DOCTUS</p></div></div>
<script>
const windows={chat:document.getElementById('chat'),calc:document.getElementById('calc'),files:document.getElementById('files'),calendar:document.getElementById('calendar')};document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>Object.entries(windows).forEach(([k,w])=>w.classList.toggle('active',k===b.dataset.window)));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>windows[b.dataset.close].classList.remove('active'));document.getElementById('distribution').onclick=()=>document.getElementById('modal').classList.add('active');document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('active');function clock(){const n=new Date();date.textContent=new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(n);time.textContent=new Intl.DateTimeFormat('pl-PL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(n)}clock();setInterval(clock,1000);const date=document.getElementById('date'),time=document.getElementById('time');clock();const welcome=document.getElementById('welcome');setTimeout(()=>welcome.classList.add('show'),80);setTimeout(()=>{welcome.classList.remove('show');welcome.classList.add('hide');setTimeout(()=>document.getElementById('brand').classList.add('show'),700)},5080);document.getElementById('form').onsubmit=e=>{e.preventDefault();const i=document.getElementById('input'),v=i.value.trim();if(!v)return;document.getElementById('messages').insertAdjacentHTML('beforeend',`<div class="message user"><strong>TY</strong>${v}</div>`);i.value='';setTimeout(()=>document.getElementById('messages').insertAdjacentHTML('beforeend','<div class="message assistant"><strong>ARGO DOCTUS</strong>Rozumiem. Pomogę Ci uporządkować ten temat.</div>'),250)};const grid=document.getElementById('grid'),display=document.getElementById('display');['7','8','9','/','C','4','5','6','*','(','1','2','3','-',' )','0','.','+','=','%'].forEach(v=>{const b=document.createElement('button');b.textContent=v.trim();b.onclick=()=>{if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return '+display.value)()}catch{display.value='Błąd'}}else display.value+=v};grid.appendChild(b)});document.getElementById('notes').value=localStorage.argoNotes||'';document.getElementById('notes').oninput=e=>localStorage.argoNotes=e.target.value;
</script></body></html>
